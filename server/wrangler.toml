name = "fog-push"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Раз в час: сервер сам решает, у кого из подписчиков наступило окно доставки
[triggers]
crons = ["0 * * * *"]

# Хранилище подписок. ID подставится командой:
#   npx wrangler kv namespace create SUBS
[[kv_namespaces]]
binding = "SUBS"
id = "ЗАМЕНИТЬ_НА_ID_ИЗ_КОМАНДЫ_ВЫШЕ"

